# One-command local stack: make dev  (docker compose up --build)
name: brightline

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brightline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brightline-dev-only}
      POSTGRES_DB: brightline_app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brightline} -d brightline_app"]
      interval: 5s
      timeout: 3s
      retries: 20

  legacy-api:
    build:
      context: .
      dockerfile: docker/legacyorders.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LegacyOrders: Host=postgres;Database=brightline_legacy;Username=${POSTGRES_USER:-brightline};Password=${POSTGRES_PASSWORD:-brightline-dev-only}
      LegacyOrders__ApiKey: ${LegacyOrders__ApiKey:-dev-legacy-api-key-change-me}
      LegacyOrders__AdminKey: ${LegacyOrders__AdminKey:-dev-legacy-admin-key-change-me}
      LegacyOrders__MigrateOnStartup: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: legacy-orders-api
    ports:
      - "5081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__App: Host=postgres;Database=brightline_app;Username=${POSTGRES_USER:-brightline};Password=${POSTGRES_PASSWORD:-brightline-dev-only}
      LegacyOrders__BaseUrl: http://legacy-api:8080
      LegacyOrders__ApiKey: ${LegacyOrders__ApiKey:-dev-legacy-api-key-change-me}
      Database__MigrateOnStartup: "true"
      Worker__Mode: embedded
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: brightline-web
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      legacy-api:
        condition: service_started

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"

volumes:
  pgdata:
