name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  ContinuousIntegrationBuild: "true"

jobs:
  build-test:
    name: Build, format, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
      - name: Restore
        run: make setup
      - name: Build (warnings as errors, analyzers, nullable)
        run: make build
      - name: Format
        run: make lint
      - name: Test (unit, integration with Testcontainers Postgres, bUnit components)
        run: make test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
      - run: make setup
      - name: Chat → verify → return with confirmation → staff sees the ticket
        run: make e2e

  images:
    name: Docker images + scan
    runs-on: ubuntu-24.04
    needs: build-test
    strategy:
      matrix:
        image: [web, legacyorders]
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f docker/${{ matrix.image }}.Dockerfile -t brightline-${{ matrix.image }}:ci .
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: brightline-${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  bicep:
    name: Validate Azure Bicep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build and lint deploy/azure
        run: |
          az bicep install
          az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
          az bicep lint --file deploy/azure/main.bicep
          POSTGRES_ADMIN_PASSWORD=x LEGACY_API_KEY=x az bicep build-params --file deploy/azure/main.bicepparam --stdout > /dev/null
